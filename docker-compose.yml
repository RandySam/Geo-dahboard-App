services:
  db:
    image: postgis/postgis:16-3.4
    container_name: db_bekasi
    restart: always
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - bekasi_network

  backend:
    build: .
    container_name: fastapi_backend
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - bekasi_network
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_bekasi
    restart: always
    env_file:
      - .env
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    depends_on:
      - db
    networks:
      - bekasi_network

volumes:
  db_data:

networks:
  bekasi_network:
    driver: bridge